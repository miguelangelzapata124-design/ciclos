<header><a href="index.html">← Volver al menú</a><h1>Ejercicio 3</h1></header>
<main><p>Ingresa el presupuesto y los gastos separados por comas; el último gasto debe ser 0.</p><form id="formulario"><label for="presupuestoEntrada">Presupuesto disponible:</label><input type="number" id="presupuestoEntrada" min="0" step="any" required><label for="gastosEntrada">Gastos separados por comas; termina con 0:</label><textarea id="gastosEntrada" rows="3" required></textarea><button type="submit">Registrar gastos</button></form><section><h2>Resultados</h2><p id="mensaje">Aún no hay datos.</p><p>Presupuesto: <strong id="presupuesto">—</strong></p><p>Total gastado: <strong id="totalGastado">—</strong></p><p>Dinero restante: <strong id="restante">—</strong></p><p>Gastos mayores a $50.000: <strong id="gastosAltos">—</strong></p></section></main>
<script src="js/ejercicio3.js"></script>
</body>
